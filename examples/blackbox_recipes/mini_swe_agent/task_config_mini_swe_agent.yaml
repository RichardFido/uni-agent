# Task Config for the mini-swe-agent blackbox recipe.
#
# The sample rows (produced by `uni_agent.tasks.swe_rebench.preprocess` /
# `uni_agent.tasks.swe_bench.preprocess`) carry only the canonical sandbox image name
# (`sandbox.image`) plus prompt/metadata; everything below is the per-task default
# layered on top by `TaskConfigResolver` (file defaults -> sample values -> runtime
# model binding).
#
# - sandbox.provider=openyuanrong reuses `uni_agent.sandbox.openyuanrong`; the
#   sandbox mounts the prebuilt tool image (mini-swe-agent + run_agent.py) at
#   /opt/mini-swe-agent.
# - sandbox.sandbox_kwargs.proxy_port is the in-sandbox reverse-tunnel port; the
#   runtime `upstream` (gateway host:port) is injected by `run_task`, which also
#   syncs `agent.proxy_port` to this value.
# - agent.model.base_url/api_key/model_name are injected at runtime from the gateway
#   session; the mini_swe_agent rewrites base_url to http://127.0.0.1:<proxy_port>.
- name: swe_rebench
  sandbox:
    provider: openyuanrong
    runtime_timeout: 7200
    sandbox_kwargs:
      proxy_port: 38197
      mounts:
        - target: /opt/mini-swe-agent
          image_url: swr.cn-east-3.myhuaweicloud.com/openyuanrong/mini-swe-agent-tool:latest
  agent:
    name: mini_swe_agent
    step_limit: 100
    run_timeout: 7200
    conda_env: testbed

- name: swe_bench
  sandbox:
